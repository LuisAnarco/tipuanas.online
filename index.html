<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Av. das Tipuanas Local — Compre do Vizinho</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-store text-xl text-emerald-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-none">Av. das Tipuanas</h1>
          <p class="text-xs text-emerald-200">Compre do vizinho • Palhoça/SC</p>
        </div>
      </div>
      
      <nav class="flex flex-wrap justify-center gap-2 text-sm font-medium">
        <a href="index.html" class="bg-emerald-800 text-white px-3 py-1.5 rounded-lg border border-emerald-500">
          <i class="fa-solid fa-shop mr-1"></i> Vitrine Lojas
        </a>
        <a href="pedidos.html" class="hover:bg-emerald-600 px-3 py-1.5 rounded-lg transition">
          <i class="fa-solid fa-location-dot mr-1"></i> Meus Pedidos
        </a>
        <a href="lojista.html" class="hover:bg-emerald-600 px-3 py-1.5 rounded-lg transition">
          <i class="fa-solid fa-user-tie mr-1"></i> Painel Lojista
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-gradient-to-r from-emerald-900 to-teal-800 text-white p-6 rounded-2xl shadow-lg mb-8">
      <span class="bg-emerald-500/30 text-emerald-200 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Comércio Local</span>
      <h2 class="text-2xl font-extrabold mt-2">Seus vizinhos a um clique</h2>
      <p class="text-emerald-100 text-sm mt-1">Peça direto dos comércios da avenida sem intermediários.</p>
    </div>

    <h3 class="text-xl font-bold text-gray-800 mb-4">Lojas Disponíveis</h3>
    <div id="stores-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    const INITIAL_STORES = [
      {
        id: "padaria-tipuanas",
        name: "Padaria & Confeitaria Tipuanas",
        category: "Padaria e Café",
        rating: 4.9,
        deliveryTime: "15-25 min",
        minOrder: "R$ 15,00",
        address: "Av. das Tipuanas, nº 140"
      },
      {
        id: "horti-fruti-vizinho",
        name: "Hortifruti do Seu Zé",
        category: "Frutas e Verduras",
        rating: 4.8,
        deliveryTime: "20-30 min",
        minOrder: "R$ 20,00",
        address: "Av. das Tipuanas, nº 85"
      },
      {
        id: "marmitaria-bairro",
        name: "Marmitaria Caseira da Maria",
        category: "Restaurante",
        rating: 4.9,
        deliveryTime: "30-40 min",
        minOrder: "R$ 25,00",
        address: "Av. das Tipuanas, nº 310"
      }
    ];

    function init() {
      let stores = JSON.parse(localStorage.getItem('tipuanas_stores')) || INITIAL_STORES;
      localStorage.setItem('tipuanas_stores', JSON.stringify(stores));

      const grid = document.getElementById('stores-grid');
      grid.innerHTML = stores.map(store => `
        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition border border-gray-100 flex flex-col justify-between p-5">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded">${store.category}</span>
              <span class="text-xs font-bold text-amber-500"><i class="fa-solid fa-star"></i> ${store.rating}</span>
            </div>
            <h4 class="font-bold text-lg text-gray-800">${store.name}</h4>
            <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-location-dot"></i> ${store.address}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
            <span class="text-xs text-gray-500"><i class="fa-solid fa-clock"></i> ${store.deliveryTime}</span>
            <button onclick="fazerPedidoSimulado('${store.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
              Fazer Pedido Teste
            </button>
          </div>
        </div>
      `).join('');
    }

    function fazerPedidoSimulado(lojaNome) {
      const pedido = {
        id: Math.floor(1000 + Math.random() * 9000),
        loja: lojaNome,
        status: "Pendente",
        data: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };
      let pedidos = JSON.parse(localStorage.getItem('tipuanas_pedidos')) || [];
      pedidos.unshift(pedido);
      localStorage.setItem('tipuanas_pedidos', JSON.stringify(pedidos));
      alert(`Pedido #${pedido.id} realizado na ${lojaNome}! Redirecionando para acompanhamento...`);
      window.location.href = "pedidos.html";
    }

    window.onload = init;
  </script>
</body>
</html>
