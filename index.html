<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Av. das Tipuanas — Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20">

  <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg"><i class="fa-solid fa-bag-shopping mr-2"></i>Tipuanas Delivery</h1>
      <nav class="flex gap-3 text-sm font-medium">
        <a href="index.html" class="underline">Lojas</a>
        <a href="lojista.html" class="hover:underline">Painel Loja</a>
        <a href="entregador.html" class="hover:underline">Painel Entregador</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 mt-4">
    <!-- SEÇÃO 1: SELEÇÃO DE LOJAS -->
    <div id="secao-lojas">
      <h2 class="text-xl font-bold mb-4">Lojas Abertas na Avenida</h2>
      <div class="grid md:grid-cols-2 gap-4">
        
        <div onclick="abrirCardapio('Padaria Tipuanas')" class="bg-white p-4 rounded-xl shadow cursor-pointer hover:border-emerald-500 border border-transparent transition">
          <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">Padaria</span>
          <h3 class="font-bold text-lg mt-1">Padaria & Confeitaria Tipuanas</h3>
          <p class="text-xs text-gray-500">Pães, cucas, cafés e salgados</p>
        </div>

        <div onclick="abrirCardapio('Marmitaria da Maria')" class="bg-white p-4 rounded-xl shadow cursor-pointer hover:border-emerald-500 border border-transparent transition">
          <span class="text-xs bg-orange-100 text-orange-800 font-bold px-2 py-0.5 rounded">Restaurante</span>
          <h3 class="font-bold text-lg mt-1">Marmitaria Caseira da Maria</h3>
          <p class="text-xs text-gray-500">Almoço executivo e marmitex</p>
        </div>

      </div>
    </div>

    <!-- SEÇÃO 2: CARDÁPIO DA LOJA -->
    <div id="secao-cardapio" class="hidden">
      <button onclick="voltarLojas()" class="text-sm text-emerald-700 font-bold mb-4 inline-block"><i class="fa-solid fa-arrow-left"></i> Voltar para Lojas</button>
      <h2 id="nome-loja-titulo" class="text-2xl font-bold mb-4"></h2>
      
      <div class="bg-white rounded-xl shadow p-4 mb-6">
        <h3 class="font-bold text-gray-700 border-b pb-2 mb-3">Produtos Disponíveis</h3>
        <div id="lista-produtos" class="space-y-4"></div>
      </div>

      <!-- CARRINHO -->
      <div class="bg-emerald-900 text-white p-4 rounded-xl shadow">
        <h3 class="font-bold text-lg mb-2"><i class="fa-solid fa-cart-shopping"></i> Seu Pedido</h3>
        <div id="itens-carrinho" class="text-sm space-y-1 mb-3 text-emerald-100">
          <p class="text-gray-400">Carrinho vazio</p>
        </div>
        <div class="flex justify-between items-center border-t border-emerald-700 pt-3">
          <span class="font-bold">Total: R$ <span id="total-carrinho">0.00</span></span>
          <button onclick="finalizarPedido()" class="bg-emerald-500 hover:bg-emerald-400 text-gray-900 font-bold px-4 py-2 rounded-lg text-sm">
            Enviar Pedido para a Loja
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { db, collection, addDoc } from './firebase-config.js';

    const CARDAPIOS = {
      'Padaria Tipuanas': [
        { id: 1, nome: 'Pão Francês (kg)', preco: 14.90 },
        { id: 2, nome: 'Cuca Alemã de Banana', preco: 22.00 },
        { id: 3, nome: 'Café Passado (300ml)', preco: 6.00 }
      ],
      'Marmitaria da Maria': [
        { id: 10, nome: 'Marmita Bife acebolado', preco: 24.00 },
        { id: 11, nome: 'Marmita Frango Grelhado', preco: 22.00 }
      ]
    };

    let lojaAtual = '';
    let carrinho = [];

    window.abrirCardapio = (loja) => {
      lojaAtual = loja;
      carrinho = [];
      document.getElementById('secao-lojas').classList.add('hidden');
      document.getElementById('secao-cardapio').classList.remove('hidden');
      document.getElementById('nome-loja-titulo').innerText = loja;
      
      const prods = CARDAPIOS[loja] || [];
      document.getElementById('lista-produtos').innerHTML = prods.map(p => `
        <div class="flex justify-between items-center border-b pb-2">
          <div>
            <h4 class="font-bold">${p.nome}</h4>
            <span class="text-sm text-gray-600">R$ ${p.preco.toFixed(2)}</span>
          </div>
          <button onclick="addCarrinho('${p.nome}', ${p.preco})" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded font-bold hover:bg-emerald-700">
            + Adicionar
          </button>
        </div>
      `).join('');
      renderCarrinho();
    };

    window.voltarLojas = () => {
      document.getElementById('secao-lojas').classList.remove('hidden');
      document.getElementById('secao-cardapio').classList.add('hidden');
    };

    window.addCarrinho = (nome, preco) => {
      carrinho.push({ nome, preco });
      renderCarrinho();
    };

    function renderCarrinho() {
      const container = document.getElementById('itens-carrinho');
      const totalEl = document.getElementById('total-carrinho');
      if (carrinho.length === 0) {
        container.innerHTML = `<p class="text-gray-400">Carrinho vazio</p>`;
        totalEl.innerText = "0.00";
        return;
      }
      container.innerHTML = carrinho.map(i => `<div class="flex justify-between"><span>${i.nome}</span><span>R$ ${i.preco.toFixed(2)}</span></div>`).join('');
      const total = carrinho.reduce((acc, item) => acc + item.preco, 0);
      totalEl.innerText = total.toFixed(2);
    }

    window.finalizarPedido = async () => {
      if (carrinho.length === 0) return alert("Adicione produtos antes de enviar!");
      
      const novoPedido = {
        loja: lojaAtual,
        itens: carrinho,
        total: carrinho.reduce((acc, item) => acc + item.preco, 0),
        status: "Pendente", // Status: Pendente -> Em Preparação -> Aguardando Entregador -> Saiu para Entrega -> Entregue
        data: new Date().toLocaleTimeString(),
        pin: Math.floor(1000 + Math.random() * 9000)
      };

      try {
        await addDoc(collection(db, "pedidos"), novoPedido);
        alert(`Pedido enviado para a ${lojaAtual}! Acompanhe na tela do Lojista.`);
        carrinho = [];
        renderCarrinho();
        voltarLojas();
      } catch (e) {
        alert("Erro ao enviar pedido: " + e.message);
      }
    };
  </script>
</body>
</html>
