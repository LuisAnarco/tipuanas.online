<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="index.html" class="text-slate-500 text-sm font-bold">← Início</a>
            <h1 class="font-extrabold text-base text-slate-900">Status do Pedido</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 w-full flex-1 space-y-5">
        
        <!-- Card de Status do Pedido -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm text-center space-y-3">
            <span class="text-3xl" id="status-icon">⏳</span>
            <div>
                <h2 class="text-lg font-bold text-slate-900" id="status-title">Buscando pedido...</h2>
                <p class="text-xs text-slate-500 mt-1" id="status-desc">Aguarde enquanto carregamos as informações.</p>
            </div>
            
            <!-- PIN do Cliente -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 inline-block w-full mt-2">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Seu PIN de Confirmação</p>
                <p class="text-2xl font-extrabold text-emerald-600 font-mono tracking-widest mt-0.5" id="delivery-pin">----</p>
                <p class="text-[10px] text-slate-400 mt-1">Informe este código ao entregador no momento da entrega.</p>
            </div>
        </div>

        <!-- Linha do Tempo -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Etapas da Entrega</h3>
            
            <div class="space-y-4 text-xs font-medium">
                <div class="flex items-center gap-3 text-slate-400" id="step-pending">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                    <p>Pedido Recebido pelo Lojista</p>
                </div>
                <div class="flex items-center gap-3 text-slate-400" id="step-preparing">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                    <p>Em Preparação</p>
                </div>
                <div class="flex items-center gap-3 text-slate-400" id="step-transit">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                    <p>Saiu para Entrega</p>
                </div>
                <div class="flex items-center gap-3 text-slate-400" id="step-completed">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                    <p>Pedido Concluído</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fdhnzdjxbztyomzhunxw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkaG56ZGp4Ynp0eW9temh1bnh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzU4MTQsImV4cCI6MjEwNDMxMTgxNH0.5HC_ZMgtXdQWbMrhw0jzMWcmYee902crA6rbl3F42aI';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', () => {
            if (orderId) {
                trackOrder(orderId);
            } else {
                document.getElementById('status-title').textContent = 'Pedido Não Encontrado';
                document.getElementById('status-desc').textContent = 'Acesse o link enviado no seu WhatsApp para acompanhar.';
            }
        });

        async function trackOrder(id) {
            const { data: order, error } = await sb.from('orders').select('*').eq('id', id).single();
            if (error || !order) return;

            updateUI(order);

            // Supabase Realtime para ouvir atualizações no status
            sb.channel(`order:${id}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${id}` }, payload => {
                    updateUI(payload.new);
                }).subscribe();
        }

        function updateUI(order) {
            document.getElementById('delivery-pin').textContent = order.delivery_pin;
            
            const statusMap = {
                'novo': { icon: '⏳', title: 'Aguardando Lojista', desc: 'O comércio recebeu seu pedido e irá confirmar em breve.' },
                'em_preparacao': { icon: '👨‍🍳', title: 'Em Preparação', desc: 'O estabelecimento aceitou e está preparando seu pedido.' },
                'pronto': { icon: '✅', title: 'Pronto p/ Retirada', desc: 'Seu pedido está pronto, aguardando o entregador.' },
                'em_rota': { icon: '🛵', title: 'A Caminho!', desc: 'O entregador já está a caminho do seu endereço.' },
                'entregue': { icon: '🎉', title: 'Entregue com Sucesso', desc: 'Obrigado por comprar do comércio local!' },
                'cancelado': { icon: '❌', title: 'Pedido Cancelado', desc: 'Este pedido foi cancelado.' }
            };

            const current = statusMap[order.status] || statusMap['novo'];
            document.getElementById('status-icon').textContent = current.icon;
            document.getElementById('status-title').textContent = current.title;
            document.getElementById('status-desc').textContent = current.desc;
        }
    </script>
</body>
</html>
