<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center gap-3">
            <a href="index.html" class="text-slate-500 text-sm font-bold">← Início</a>
            <h1 class="font-extrabold text-base text-slate-900">Meus Pedidos</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 w-full flex-1 space-y-4">

        <!-- Busca por telefone: recupera pedidos feitos em outro aparelho ou com o histórico apagado -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-2">
            <label for="phone-input" class="block text-xs font-semibold text-slate-700">Buscar pelo seu WhatsApp</label>
            <div class="flex gap-2">
                <input id="phone-input" type="tel" inputmode="tel" placeholder="Ex: 48999998888" class="flex-1 text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
                <button id="search-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 rounded-xl">Buscar</button>
            </div>
            <p class="text-[10px] text-slate-400">Use o mesmo número informado ao finalizar o pedido.</p>
        </div>

        <div id="orders-list" class="space-y-3">
            <p class="text-center text-xs text-slate-400 py-8">Carregando...</p>
        </div>
    </main>

    <script>
        const MY_ORDERS_KEY = 'tipuanas_my_orders';
        const CLIENT_KEY = 'tipuanas_client';

        const STATUS = {
            novo: { label: 'Aguardando loja', cls: 'bg-amber-50 text-amber-700 border-amber-100' },
            em_preparacao: { label: 'Em preparação', cls: 'bg-blue-50 text-blue-700 border-blue-100' },
            pronto: { label: 'Pronto', cls: 'bg-indigo-50 text-indigo-700 border-indigo-100' },
            em_rota: { label: 'A caminho', cls: 'bg-purple-50 text-purple-700 border-purple-100' },
            entregue: { label: 'Entregue', cls: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
            cancelado: { label: 'Cancelado', cls: 'bg-slate-100 text-slate-500 border-slate-200' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const phoneInput = document.getElementById('phone-input');
            let client = {};
            try { client = JSON.parse(localStorage.getItem(CLIENT_KEY)) || {}; } catch (e) {}
            if (client.phone) phoneInput.value = client.phone;

            document.getElementById('search-btn').addEventListener('click', searchByPhone);
            phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchByPhone(); });

            loadDeviceOrders();
        });

        function readIds() {
            try {
                const ids = JSON.parse(localStorage.getItem(MY_ORDERS_KEY)) || [];
                return ids.filter(id => /^[0-9a-f-]{36}$/i.test(id)); // id inválido derrubaria a consulta toda
            } catch (e) { return []; }
        }

        async function loadDeviceOrders() {
            const ids = readIds();
            if (ids.length === 0) {
                renderOrders([], 'Nenhum pedido feito neste aparelho ainda. Busque pelo seu WhatsApp acima.');
                return;
            }
            // Funções no banco devolvem só o resumo (sem endereço/PIN): cliente não tem login
            const { data, error } = await sb.rpc('get_orders_public', { p_ids: ids });
            if (error) {
                console.error('Erro ao buscar pedidos:', error);
                renderOrders([], 'Não foi possível carregar seus pedidos agora.');
                return;
            }
            renderOrders(data || [], 'Nenhum pedido encontrado.');
        }

        async function searchByPhone() {
            const phone = document.getElementById('phone-input').value.replace(/\D/g, '');
            if (phone.length < 10) {
                alert('Informe o WhatsApp com DDD (ex: 48999998888).');
                return;
            }
            document.getElementById('orders-list').innerHTML = '<p class="text-center text-xs text-slate-400 py-8">Buscando...</p>';

            const { data, error } = await sb.rpc('get_orders_by_phone', { p_phone: phone });

            if (error) {
                console.error('Erro ao buscar por telefone:', error);
                renderOrders([], 'Não foi possível buscar agora. Tente novamente.');
                return;
            }

            // Lembra os pedidos encontrados neste aparelho
            const ids = [...new Set([...(data || []).map(o => o.id), ...readIds()])].slice(0, 50);
            localStorage.setItem(MY_ORDERS_KEY, JSON.stringify(ids));

            renderOrders(data || [], 'Nenhum pedido encontrado com esse número.');
        }

        function renderOrders(orders, emptyMsg) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">${escapeHtml(emptyMsg)}</p>`;
                return;
            }

            list.innerHTML = orders.map(order => {
                const st = STATUS[order.status] || STATUS.novo;
                const items = (order.order_items || [])
                    .map(it => `${it.quantity}x ${it.products ? it.products.name : 'Item'}`)
                    .join(', ');
                const date = new Date(order.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

                return `
                    <a href="11_order_tracking_realtime.html?id=${encodeURIComponent(order.id)}" class="block bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm hover:border-emerald-300 transition space-y-1.5">
                        <div class="flex justify-between items-center gap-2">
                            <h3 class="font-bold text-sm text-slate-900 truncate">${escapeHtml(order.stores ? order.stores.name : 'Loja')}</h3>
                            <span class="shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full border ${st.cls}">${st.label}</span>
                        </div>
                        ${items ? `<p class="text-[11px] text-slate-600">${escapeHtml(items)}</p>` : ''}
                        <div class="flex justify-between text-[11px] text-slate-400">
                            <span>${date} • ${order.is_takeout ? 'Retirada' : 'Entrega'}</span>
                            <span class="font-extrabold text-emerald-600">${formatBRL(order.total_amount)}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }
    </script>
</body>
</html>
