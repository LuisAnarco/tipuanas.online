<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#26402C">
    <link rel="manifest" href="07_client_pwa_manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Meus Pedidos — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-2 py-1 flex items-center gap-1">
            <a href="index.html" aria-label="Voltar para o início" class="w-11 h-11 flex items-center justify-center text-slate-600"><span data-icon="voltar" class="w-5 h-5"></span></a>
            <h1 class="font-extrabold text-lg text-emerald-800">Meus pedidos</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 w-full flex-1 space-y-4">

        <!-- Busca por telefone: recupera pedidos feitos em outro aparelho ou com o histórico apagado -->
        <section class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2">
            <label for="phone-input" class="block text-sm font-bold text-slate-900">Buscar pelo seu WhatsApp</label>
            <div class="flex gap-2">
                <input id="phone-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ex: 48999998888" class="flex-1 min-w-0 text-base min-h-[48px] px-3 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-600">
                <input id="pin-input" type="text" inputmode="numeric" maxlength="4" placeholder="PIN" aria-label="PIN de um pedido" class="w-20 text-base min-h-[48px] text-center font-mono rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-600">
                <button type="button" id="search-btn" class="min-h-[48px] bg-emerald-700 hover:bg-emerald-800 text-slate-50 text-sm font-bold px-4 rounded-xl">Buscar</button>
            </div>
            <p class="text-xs text-slate-500">Use o número informado ao finalizar e o PIN de 4 dígitos de qualquer pedido seu (aparece no acompanhamento e na confirmação). O PIN protege seus pedidos de quem só sabe o seu número.</p>
        </section>

        <div id="orders-list" class="space-y-3">
            <p class="text-center text-sm text-slate-500 py-8">Carregando...</p>
        </div>
        <p class="text-center text-xs text-slate-500 pb-2"><a href="privacidade.html" class="underline inline-flex min-h-[44px] items-center">Privacidade e termos</a> (inclui apagar os dados deste aparelho)</p>
    </main>

    <script>
        const MY_ORDERS_KEY = 'tipuanas_my_orders';
        const CLIENT_KEY = 'tipuanas_client';

        const STATUS = {
            novo: { label: 'Aguardando loja', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
            em_preparacao: { label: 'Em preparação', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
            pronto: { label: 'Pronto', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
            em_rota: { label: 'A caminho', cls: 'bg-emerald-700 text-slate-50 border-emerald-700' },
            entregue: { label: 'Entregue', cls: 'bg-slate-100 text-emerald-700 border-slate-200' },
            cancelado: { label: 'Cancelado', cls: 'bg-red-50 text-red-600 border-red-200' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const phoneInput = document.getElementById('phone-input');
            let client = {};
            try { client = JSON.parse(localStorage.getItem(CLIENT_KEY)) || {}; } catch (e) {}
            if (client.phone) phoneInput.value = client.phone;

            document.getElementById('search-btn').addEventListener('click', searchByPhone);
            phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchByPhone(); });
            document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') searchByPhone(); });

            loadDeviceOrders();
        });

        function readIds() {
            try {
                const ids = JSON.parse(localStorage.getItem(MY_ORDERS_KEY)) || [];
                return ids.filter(id => /^[0-9a-f-]{36}$/i.test(id)); // id inválido derrubaria a consulta toda
            } catch (e) { return []; }
        }

        async function loadDeviceOrders() {
            const ids = readIds();
            if (ids.length === 0) {
                renderOrders([], 'Nenhum pedido feito neste aparelho ainda. Busque pelo seu WhatsApp acima.');
                return;
            }
            // Funções no banco devolvem só o resumo (sem endereço/PIN): cliente não tem login
            const { data, error } = await sb.rpc('get_orders_public', { p_ids: ids });
            if (error) {
                console.error('Erro ao buscar pedidos:', error);
                renderOrders([], 'Não foi possível carregar seus pedidos agora.');
                return;
            }
            renderOrders(data || [], 'Nenhum pedido encontrado.');
        }

        async function searchByPhone() {
            const phone = document.getElementById('phone-input').value.replace(/\D/g, '');
            if (phone.length < 10) {
                alert('Informe o WhatsApp com DDD (ex: 48999998888).');
                return;
            }
            const pin = document.getElementById('pin-input').value.replace(/\D/g, '');
            if (pin.length !== 4) {
                alert('Informe o PIN de 4 dígitos de um dos seus pedidos.');
                return;
            }
            document.getElementById('orders-list').innerHTML = '<p class="text-center text-sm text-slate-500 py-8">Buscando...</p>';

            const { data, error } = await sb.rpc('get_orders_by_phone', { p_phone: phone, p_pin: pin });

            if (error) {
                console.error('Erro ao buscar por telefone:', error);
                renderOrders([], (error.message || '').includes('too_many_attempts')
                    ? 'Muitas tentativas com esse número. Aguarde uma hora e tente de novo.'
                    : 'Não foi possível buscar agora. Tente novamente.');
                return;
            }

            // Lembra os pedidos encontrados neste aparelho
            const ids = [...new Set([...(data || []).map(o => o.id), ...readIds()])].slice(0, 50);
            localStorage.setItem(MY_ORDERS_KEY, JSON.stringify(ids));

            renderOrders(data || [], 'Nenhum pedido encontrado com esse número e PIN.');
        }

        function renderOrders(orders, emptyMsg) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-center text-sm text-slate-500 py-8">${escapeHtml(emptyMsg)}</p>`;
                return;
            }

            list.innerHTML = orders.map(order => {
                const st = STATUS[order.status] || STATUS.novo;
                const items = (order.order_items || [])
                    .map(it => `${it.quantity}x ${it.products ? it.products.name : 'Item'}`)
                    .join(', ');
                const date = new Date(order.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

                return `
                    <a href="11_order_tracking_realtime.html?id=${encodeURIComponent(order.id)}" class="block bg-white rounded-2xl p-4 border border-slate-200 hover:border-emerald-400 transition space-y-1.5">
                        <div class="flex justify-between items-center gap-2">
                            <h2 class="font-extrabold text-base text-emerald-800 truncate">${escapeHtml(order.stores ? order.stores.name : 'Loja')}</h2>
                            <span class="shrink-0 text-xs font-bold px-2.5 py-0.5 rounded-full border ${st.cls}">${st.label}</span>
                        </div>
                        ${items ? `<p class="text-sm text-slate-600">${escapeHtml(items)}</p>` : ''}
                        <div class="flex justify-between text-xs text-slate-500 tabular-nums">
                            <span>${date} · ${order.is_takeout ? 'Retirada' : 'Entrega'}</span>
                            <span class="font-display font-extrabold text-sm text-emerald-800">${formatBRL(order.total_amount)}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }
    </script>
</body>
</html>
