<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display de Balcão — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body { background: white; }
            .no-print { display: none; }
            .print-card { border: 2px solid #e2e8f0; shadow: none; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Botão Imprimir -->
    <button onclick="window.print()" class="no-print mb-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition text-sm flex items-center gap-2">
        🖨️ Imprimir Display (A5 / Balcão)
    </button>

    <!-- Cartão de Balcão (Proporção A5) -->
    <div class="print-card bg-white w-full max-w-xs rounded-3xl p-6 shadow-xl border border-slate-200 text-center space-y-5">
        
        <!-- Header -->
        <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-[11px] font-extrabold tracking-wide uppercase border border-emerald-100">
                🌿 Av. das Tipuanas
            </div>
            <h1 id="qr-title" class="text-2xl font-black text-slate-900 leading-tight">Compre do Vizinho</h1>
            <p class="text-xs text-slate-500 font-medium">Faça seu pedido direto pelo celular</p>
        </div>

        <!-- Container do QR Code -->
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center justify-center space-y-3">
            <div id="qrcode" class="p-2 bg-white rounded-xl shadow-sm"></div>
            <p class="text-[11px] font-bold text-slate-600">Aponte a câmera do seu celular</p>
        </div>

        <!-- Instruções Rápidas -->
        <div class="grid grid-cols-3 gap-2 text-center text-[10px] font-semibold text-slate-600 border-t border-slate-100 pt-4">
            <div>
                <span class="block text-base">📱</span>
                Escaneie
            </div>
            <div>
                <span class="block text-base">🛒</span>
                Monte o Pedido
            </div>
            <div>
                <span class="block text-base">💬</span>
                Receba no Whats
            </div>
        </div>

        <!-- Footer -->
        <p class="text-[9px] text-slate-400 font-medium pt-1">
            Plataforma Hiperlocal • avenidadastipuanas.online
        </p>
    </div>

    <script>
        // Com ?slug=, o QR aponta para a página própria da loja; sem, para a vitrine do bairro.
        // A URL usa o domínio em que o site está aberto (produção ou preview).
        const slug = new URLSearchParams(window.location.search).get('slug');
        const baseUrl = new URL('.', window.location.href).href;
        const target = slug ? `${baseUrl}loja.html?slug=${encodeURIComponent(slug)}` : baseUrl;

        if (typeof QRCode === 'function') {
            new QRCode(document.getElementById("qrcode"), {
                text: target,
                width: 140,
                height: 140,
                colorDark: "#065f46",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }
        document.getElementById('qrcode').dataset.target = target;

        if (slug) {
            sb.from('stores').select('name').eq('slug', slug).maybeSingle().then(({ data }) => {
                if (data) document.getElementById('qr-title').textContent = data.name;
            });
        }
    </script>
</body>
</html>
