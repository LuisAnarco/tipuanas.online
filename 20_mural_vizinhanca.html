<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural da Vizinhança — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-600 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="index.html" class="text-emerald-100 text-sm font-bold">← Início</a>
            <div class="text-center">
                <h1 class="font-extrabold text-base leading-tight">Mural da Vizinhança</h1>
                <p class="text-[11px] text-emerald-100">Desapego e "Procuro Por"</p>
            </div>
            <span class="w-10"></span>
        </div>
        <!-- Abas -->
        <div class="max-w-md mx-auto px-4 pb-2 flex gap-2 text-xs font-bold">
            <button id="tab-ver" onclick="mostrarAba('ver')" class="flex-1 py-1.5 rounded-lg bg-white text-emerald-700">Ver Mural</button>
            <button id="tab-postar" onclick="mostrarAba('postar')" class="flex-1 py-1.5 rounded-lg bg-emerald-700/60 text-white">Postar</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 w-full flex-1 space-y-5">

        <!-- ABA: Ver Mural -->
        <section id="ver-section" class="space-y-4">
            <div class="flex gap-2 text-xs font-bold">
                <button id="filter-desapego" onclick="filtrarPosts('desapego')" class="flex-1 py-2 rounded-lg border border-emerald-600 bg-emerald-600 text-white">🎁 Desapego</button>
                <button id="filter-procuro" onclick="filtrarPosts('procuro')" class="flex-1 py-2 rounded-lg border border-slate-300 bg-white text-slate-600">🔎 Procuro Por</button>
            </div>
            <div id="posts-list" class="space-y-3">
                <p class="text-center text-xs text-slate-400 py-8">Carregando publicações...</p>
            </div>
        </section>

        <!-- ABA: Postar -->
        <section id="postar-section" class="hidden bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">O que você quer postar?</label>
                <div class="flex gap-2">
                    <label class="flex-1 flex items-center gap-2 text-xs p-2.5 rounded-lg border border-slate-300 cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
                        <input type="radio" name="mp-type" value="desapego" checked class="accent-emerald-600">
                        🎁 Desapego (doar/vender)
                    </label>
                    <label class="flex-1 flex items-center gap-2 text-xs p-2.5 rounded-lg border border-slate-300 cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
                        <input type="radio" name="mp-type" value="procuro" class="accent-emerald-600">
                        🔎 Procuro Por
                    </label>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Título</label>
                <input id="mp-title" type="text" placeholder="Ex: Sofá 3 lugares / Procuro bicicleta infantil" class="w-full text-sm p-2.5 rounded-lg border border-slate-300">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição</label>
                <textarea id="mp-description" rows="3" placeholder="Detalhe o item ou o que você está procurando" class="w-full text-sm p-2.5 rounded-lg border border-slate-300"></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Preço (opcional — deixe em branco se for de graça ou a combinar)</label>
                <input id="mp-price" type="number" min="0" step="0.01" placeholder="Ex: 50.00" class="w-full text-sm p-2.5 rounded-lg border border-slate-300">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Seu nome</label>
                    <input id="mp-name" type="text" placeholder="Ex: Maria Silva" class="w-full text-sm p-2.5 rounded-lg border border-slate-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Seu WhatsApp (com DDD)</label>
                    <input id="mp-whatsapp" type="text" placeholder="Ex: 48999998888" class="w-full text-sm p-2.5 rounded-lg border border-slate-300">
                </div>
            </div>
            <button onclick="publicarPost()" id="mp-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-lg text-sm transition active:scale-95">
                Publicar no Mural
            </button>
            <p id="mp-error" class="hidden text-xs text-red-600"></p>
        </section>

    </main>

    <script>
        let currentFilter = 'desapego';

        document.addEventListener('DOMContentLoaded', () => {
            carregarPosts();
        });

        function mostrarAba(aba) {
            document.getElementById('ver-section').classList.toggle('hidden', aba !== 'ver');
            document.getElementById('postar-section').classList.toggle('hidden', aba !== 'postar');
            document.getElementById('tab-ver').className = aba === 'ver'
                ? 'flex-1 py-1.5 rounded-lg bg-white text-emerald-700'
                : 'flex-1 py-1.5 rounded-lg bg-emerald-700/60 text-white';
            document.getElementById('tab-postar').className = aba === 'postar'
                ? 'flex-1 py-1.5 rounded-lg bg-white text-emerald-700'
                : 'flex-1 py-1.5 rounded-lg bg-emerald-700/60 text-white';
        }

        function filtrarPosts(tipo) {
            currentFilter = tipo;
            document.getElementById('filter-desapego').className = tipo === 'desapego'
                ? 'flex-1 py-2 rounded-lg border border-emerald-600 bg-emerald-600 text-white'
                : 'flex-1 py-2 rounded-lg border border-slate-300 bg-white text-slate-600';
            document.getElementById('filter-procuro').className = tipo === 'procuro'
                ? 'flex-1 py-2 rounded-lg border border-emerald-600 bg-emerald-600 text-white'
                : 'flex-1 py-2 rounded-lg border border-slate-300 bg-white text-slate-600';
            carregarPosts();
        }

        async function carregarPosts() {
            const listEl = document.getElementById('posts-list');
            listEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Carregando publicações...</p>`;

            const { data: posts, error } = await sb
                .from('community_posts')
                .select('*')
                .eq('post_type', currentFilter)
                .eq('is_active', true)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao buscar publicações:', error);
                listEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Não foi possível carregar o mural agora.</p>`;
                return;
            }

            if (!posts || posts.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Nenhuma publicação por aqui ainda.</p>`;
                return;
            }

            listEl.innerHTML = posts.map(post => `
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-2">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-slate-900 text-sm">${escapeHtml(post.title)}</h3>
                        ${post.price ? `<span class="text-xs font-extrabold text-emerald-600">R$ ${Number(post.price).toFixed(2)}</span>` : `<span class="text-[10px] text-slate-400">${post.post_type === 'desapego' ? 'De graça / a combinar' : 'A combinar'}</span>`}
                    </div>
                    <p class="text-xs text-slate-600">${escapeHtml(post.description)}</p>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-50">
                        <span class="text-[11px] text-slate-400">${escapeHtml(post.author_name)}</span>
                        <a href="https://wa.me/${toWhatsappNumber(post.author_whatsapp)}?text=${encodeURIComponent(`Olá! Vi seu anúncio "${post.title}" no Mural da Vizinhança do Tipuanas.online.`)}" target="_blank" rel="noopener" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg">
                            Chamar no WhatsApp
                        </a>
                    </div>
                </div>
            `).join('');
        }

        async function publicarPost() {
            const postType = document.querySelector('input[name="mp-type"]:checked').value;
            const title = document.getElementById('mp-title').value.trim();
            const description = document.getElementById('mp-description').value.trim();
            const priceRaw = document.getElementById('mp-price').value;
            const price = priceRaw ? parseFloat(priceRaw) : null;
            const name = document.getElementById('mp-name').value.trim();
            const whatsapp = document.getElementById('mp-whatsapp').value.trim().replace(/\D/g, '');
            const errorEl = document.getElementById('mp-error');
            const submitBtn = document.getElementById('mp-submit');

            if (!title || !name || !whatsapp) {
                errorEl.textContent = 'Preencha ao menos título, seu nome e WhatsApp.';
                errorEl.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Publicando...';

            const { error } = await sb.from('community_posts').insert([{
                post_type: postType,
                title,
                description,
                price,
                author_name: name,
                author_whatsapp: whatsapp,
                is_active: true
            }]);

            submitBtn.disabled = false;
            submitBtn.textContent = 'Publicar no Mural';

            if (error) {
                console.error('Erro ao publicar:', error);
                errorEl.textContent = 'Não foi possível publicar agora. Tente novamente em instantes.';
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            document.getElementById('mp-title').value = '';
            document.getElementById('mp-description').value = '';
            document.getElementById('mp-price').value = '';
            document.getElementById('mp-name').value = '';
            document.getElementById('mp-whatsapp').value = '';

            filtrarPosts(postType);
            mostrarAba('ver');
        }
    </script>
</body>
</html>
