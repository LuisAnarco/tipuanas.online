<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#26402C">
    <link rel="manifest" href="07_client_pwa_manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="description" content="Desapego e "procuro por" entre vizinhos da Av. das Tipuanas.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tipuanas.online">
    <meta property="og:title" content="Mural da Vizinhança — Tipuanas.online">
    <meta property="og:description" content="Desapego e "procuro por" entre vizinhos da Av. das Tipuanas.">
    <meta property="og:image" content="icons/icon-512.png">
    <meta name="twitter:card" content="summary">
    <title>Mural da Vizinhança — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-700 text-slate-50 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-2 py-1 flex items-center justify-between">
            <a href="index.html" class="min-h-[44px] px-2 flex items-center gap-1 text-slate-50 text-sm font-bold"><span data-icon="voltar" class="w-5 h-5"></span>Início</a>
            <div class="text-center">
                <h1 class="font-extrabold text-base leading-tight">Mural da Vizinhança</h1>
                <p class="text-xs text-slate-100">Desapego e procuro por</p>
            </div>
            <span class="w-16"></span>
        </div>
        <!-- Abas -->
        <div class="max-w-md mx-auto px-4 pb-2 flex gap-2 text-sm font-bold">
            <button type="button" id="tab-ver" onclick="mostrarAba('ver')" class="flex-1 min-h-[44px] rounded-lg bg-white text-emerald-800">Ver mural</button>
            <button type="button" id="tab-postar" onclick="mostrarAba('postar')" class="flex-1 min-h-[44px] rounded-lg bg-emerald-800 text-slate-50">Postar</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 w-full flex-1 space-y-5">

        <!-- ABA: Ver Mural -->
        <section id="ver-section" class="space-y-4">
            <div class="flex gap-2 text-sm font-bold">
                <button type="button" id="filter-desapego" onclick="filtrarPosts('desapego')" class="flex-1 min-h-[44px] rounded-lg border border-emerald-700 bg-emerald-700 text-slate-50">Desapego</button>
                <button type="button" id="filter-procuro" onclick="filtrarPosts('procuro')" class="flex-1 min-h-[44px] rounded-lg border border-slate-300 bg-white text-slate-700">Procuro por</button>
            </div>
            <div id="posts-list" class="space-y-3">
                <p class="text-center text-sm text-slate-500 py-8">Carregando publicações...</p>
            </div>
        </section>

        <!-- ABA: Postar -->
        <section id="postar-section" class="hidden bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
            <div>
                <p class="block text-sm font-bold text-slate-900 mb-1">O que você quer postar?</p>
                <div class="flex gap-2">
                    <label class="flex-1 min-h-[48px] flex items-center gap-2 text-sm px-3 rounded-lg border border-slate-300 cursor-pointer has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
                        <input type="radio" name="mp-type" value="desapego" checked class="accent-emerald-700 w-4 h-4">
                        Desapego (doar/vender)
                    </label>
                    <label class="flex-1 min-h-[48px] flex items-center gap-2 text-sm px-3 rounded-lg border border-slate-300 cursor-pointer has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
                        <input type="radio" name="mp-type" value="procuro" class="accent-emerald-700 w-4 h-4">
                        Procuro por
                    </label>
                </div>
            </div>
            <div>
                <label for="mp-title" class="block text-sm font-bold text-slate-900 mb-1">Título</label>
                <input id="mp-title" type="text" placeholder="Ex: Sofá 3 lugares / Procuro bicicleta infantil" class="w-full text-base min-h-[48px] px-3 rounded-lg border border-slate-300">
            </div>
            <div>
                <label for="mp-description" class="block text-sm font-bold text-slate-900 mb-1">Descrição</label>
                <textarea id="mp-description" rows="3" placeholder="Detalhe o item ou o que você está procurando" class="w-full text-base p-3 rounded-lg border border-slate-300"></textarea>
            </div>
            <div>
                <label for="mp-price" class="block text-sm font-bold text-slate-900 mb-1">Preço (opcional — deixe em branco se for de graça ou a combinar)</label>
                <input id="mp-price" type="number" min="0" step="0.01" placeholder="Ex: 50.00" class="w-full text-base min-h-[48px] px-3 rounded-lg border border-slate-300">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label for="mp-name" class="block text-sm font-bold text-slate-900 mb-1">Seu nome</label>
                    <input id="mp-name" type="text" placeholder="Ex: Maria Silva" class="w-full text-base min-h-[48px] px-3 rounded-lg border border-slate-300">
                </div>
                <div>
                    <label for="mp-whatsapp" class="block text-sm font-bold text-slate-900 mb-1">Seu WhatsApp (com DDD)</label>
                    <input id="mp-whatsapp" type="text" placeholder="Ex: 48999998888" class="w-full text-base min-h-[48px] px-3 rounded-lg border border-slate-300">
                </div>
            </div>
            <p class="text-xs text-slate-500">O anúncio fica no mural por 30 dias. Neste aparelho aparece o botão para você mesmo remover antes, se quiser. Seu nome e WhatsApp ficam visíveis no anúncio — veja a <a href="privacidade.html" class="underline">política de privacidade</a>.</p>
            <button type="button" onclick="publicarPost()" id="mp-submit" class="w-full min-h-[48px] bg-amber-500 hover:bg-amber-600 text-emerald-900 font-extrabold px-4 rounded-lg text-base transition active:scale-95">
                Publicar no mural
            </button>
            <p id="mp-error" class="hidden text-xs text-red-600"></p>
        </section>

    </main>

    <script>
        let currentFilter = 'desapego';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('posts-list').addEventListener('click', event => {
                const btn = event.target.closest('[data-remove-post]');
                if (btn) removerMeuPost(btn.dataset.removePost);
            });
            carregarPosts();
        });

        function mostrarAba(aba) {
            document.getElementById('ver-section').classList.toggle('hidden', aba !== 'ver');
            document.getElementById('postar-section').classList.toggle('hidden', aba !== 'postar');
            document.getElementById('tab-ver').className = aba === 'ver'
                ? 'flex-1 min-h-[44px] rounded-lg bg-white text-emerald-800'
                : 'flex-1 min-h-[44px] rounded-lg bg-emerald-800 text-slate-50';
            document.getElementById('tab-postar').className = aba === 'postar'
                ? 'flex-1 min-h-[44px] rounded-lg bg-white text-emerald-800'
                : 'flex-1 min-h-[44px] rounded-lg bg-emerald-800 text-slate-50';
        }

        function filtrarPosts(tipo) {
            currentFilter = tipo;
            document.getElementById('filter-desapego').className = tipo === 'desapego'
                ? 'flex-1 min-h-[44px] rounded-lg border border-emerald-700 bg-emerald-700 text-slate-50'
                : 'flex-1 min-h-[44px] rounded-lg border border-slate-300 bg-white text-slate-700';
            document.getElementById('filter-procuro').className = tipo === 'procuro'
                ? 'flex-1 min-h-[44px] rounded-lg border border-emerald-700 bg-emerald-700 text-slate-50'
                : 'flex-1 min-h-[44px] rounded-lg border border-slate-300 bg-white text-slate-700';
            carregarPosts();
        }

        // Chaves de remoção dos anúncios publicados neste aparelho: { id: chave }
        const MY_POSTS_KEY = 'tipuanas_my_posts';
        function readMyPosts() {
            try { return JSON.parse(localStorage.getItem(MY_POSTS_KEY)) || {}; } catch (e) { return {}; }
        }

        function daysLeft(expiresAt) {
            return Math.max(0, Math.ceil((new Date(expiresAt) - Date.now()) / 86400000));
        }

        async function removerMeuPost(postId) {
            const key = readMyPosts()[postId];
            if (!key || !confirm('Remover seu anúncio do mural?')) return;
            const { data: removed, error } = await sb.rpc('remove_community_post', { p_id: postId, p_key: key });
            if (error || !removed) {
                alert('Não foi possível remover o anúncio.');
                if (error) console.error(error);
                return;
            }
            const mine = readMyPosts();
            delete mine[postId];
            localStorage.setItem(MY_POSTS_KEY, JSON.stringify(mine));
            carregarPosts();
        }

        async function carregarPosts() {
            const listEl = document.getElementById('posts-list');
            listEl.innerHTML = `<p class="text-center text-sm text-slate-500 py-8">Carregando publicações...</p>`;

            const { data: posts, error } = await sb
                .from('community_posts')
                .select('id, post_type, title, description, price, author_name, author_whatsapp, created_at, expires_at')
                .eq('post_type', currentFilter)
                .eq('is_active', true)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao buscar publicações:', error);
                listEl.innerHTML = `<p class="text-center text-sm text-slate-500 py-8">Não foi possível carregar o mural agora.</p>`;
                return;
            }

            if (!posts || posts.length === 0) {
                listEl.innerHTML = `<p class="text-center text-sm text-slate-500 py-8">Nenhuma publicação por aqui ainda.</p>`;
                return;
            }

            const mine = readMyPosts();
            listEl.innerHTML = posts.map(post => `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2">
                    <div class="flex items-center justify-between">
                        <h3 class="font-extrabold text-emerald-800 text-base">${escapeHtml(post.title)}</h3>
                        ${post.price ? `<span class="text-sm font-extrabold text-emerald-800 tabular-nums">${formatBRL(post.price)}</span>` : `<span class="text-xs text-slate-500">${post.post_type === 'desapego' ? 'De graça / a combinar' : 'A combinar'}</span>`}
                    </div>
                    <p class="text-sm text-slate-600">${escapeHtml(post.description)}</p>
                    <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                        <span class="text-xs text-slate-500">${escapeHtml(post.author_name)} · vence em ${daysLeft(post.expires_at)} dia(s)</span>
                        <a href="https://wa.me/${toWhatsappNumber(post.author_whatsapp)}?text=${encodeURIComponent(`Olá! Vi seu anúncio "${post.title}" no Mural da Vizinhança do Tipuanas.online.`)}" target="_blank" rel="noopener" class="shrink-0 inline-flex min-h-[44px] items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 text-slate-50 text-sm font-bold px-3 rounded-lg">${icon('conversa', 'w-4 h-4')}
                            Chamar no WhatsApp
                        </a>
                    </div>
                    ${mine[post.id] ? `<button type="button" data-remove-post="${escapeHtml(post.id)}" class="w-full min-h-[44px] text-sm font-semibold text-red-600 border border-red-200 rounded-lg hover:bg-red-50">Remover meu anúncio</button>` : ''}
                </div>
            `).join('');
        }

        async function publicarPost() {
            const postType = document.querySelector('input[name="mp-type"]:checked').value;
            const title = document.getElementById('mp-title').value.trim();
            const description = document.getElementById('mp-description').value.trim();
            const priceRaw = document.getElementById('mp-price').value;
            const price = priceRaw ? parseFloat(priceRaw) : null;
            const name = document.getElementById('mp-name').value.trim();
            const whatsapp = document.getElementById('mp-whatsapp').value.trim().replace(/\D/g, '');
            const errorEl = document.getElementById('mp-error');
            const submitBtn = document.getElementById('mp-submit');

            if (!title || !name || !whatsapp) {
                errorEl.textContent = 'Preencha ao menos título, seu nome e WhatsApp.';
                errorEl.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Publicando...';

            // Publicado por função no banco, que devolve a chave para o autor remover depois
            const { data: created, error } = await sb.rpc('create_community_post', {
                p_type: postType,
                p_title: title,
                p_description: description,
                p_price: price,
                p_author_name: name,
                p_author_whatsapp: whatsapp
            });
            if (!error && created) {
                const mine = readMyPosts();
                mine[created.id] = created.key;
                localStorage.setItem(MY_POSTS_KEY, JSON.stringify(mine));
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Publicar no Mural';

            if (error) {
                console.error('Erro ao publicar:', error);
                errorEl.textContent = (error.message || '').includes('too_many_posts')
                    ? 'Limite de 3 anúncios por dia para este WhatsApp. Tente novamente amanhã.'
                    : 'Não foi possível publicar agora. Tente novamente em instantes.';
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            document.getElementById('mp-title').value = '';
            document.getElementById('mp-description').value = '';
            document.getElementById('mp-price').value = '';
            document.getElementById('mp-name').value = '';
            document.getElementById('mp-whatsapp').value = '';

            filtrarPosts(postType);
            mostrarAba('ver');
        }
    </script>
</body>
</html>
