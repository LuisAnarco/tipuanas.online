<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="manifest" href="07_client_pwa_manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body data-page="loja" class="bg-slate-50 text-slate-800 pb-24 antialiased">

    <header class="bg-emerald-700 text-slate-50 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-2 py-1 flex items-center justify-between">
            <a href="index.html" class="min-h-[44px] px-2 flex items-center gap-1 text-sm font-bold text-slate-50"><span data-icon="voltar" class="w-5 h-5"></span>Todas as lojas</a>
            <span class="font-display font-extrabold text-sm px-2">Tipuanas.online</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 space-y-4">
        <div id="store-header">
            <p class="text-center text-sm text-slate-500 py-6">Carregando a loja...</p>
        </div>
        <div id="section-tabs" class="sticky top-[52px] z-20 -mx-4 px-4 py-2 bg-slate-50/95 backdrop-blur flex gap-2 overflow-x-auto scrollbar-none"></div>
        <div id="stores-container" class="space-y-5"></div>
    </main>

    <!-- Barra do carrinho (o mesmo carrinho da vitrine) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 hidden z-40">
        <div class="max-w-md mx-auto bg-white border-t border-slate-200 px-4 py-3 flex items-center justify-between gap-3">
            <div class="min-w-0">
                <p class="text-xs font-bold text-slate-500" id="cart-item-count">0 itens</p>
                <p id="cart-total-price" class="font-display text-base font-extrabold text-emerald-800">R$ 0,00</p>
            </div>
            <a href="10_checkout_whatsapp_flow.html" class="min-h-[48px] px-5 flex items-center rounded-xl bg-amber-500 hover:bg-amber-600 text-emerald-900 text-sm font-extrabold transition">Ver sacola</a>
        </div>
    </div>

    <script src="09_multistore_cart.js"></script>
