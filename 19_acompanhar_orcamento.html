<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#26402C">
    <link rel="manifest" href="07_client_pwa_manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Acompanhar Orçamento — Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-2 py-1 flex items-center justify-between">
            <a href="index.html" class="min-h-[44px] flex items-center gap-1 text-slate-600 text-sm font-bold"><span data-icon="voltar" class="w-5 h-5"></span>Início</a>
            <h1 class="font-extrabold text-lg text-emerald-800 px-2">Seu orçamento</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 w-full flex-1 space-y-5">

        <!-- Card de Status -->
        <section class="bg-white rounded-2xl p-5 border border-slate-200 text-center space-y-3" aria-live="polite">
            <span class="mx-auto w-14 h-14 rounded-full bg-emerald-50 text-emerald-700 flex items-center justify-center" id="status-icon"><span data-icon="relogio" class="w-7 h-7"></span></span>
            <div>
                <h2 class="text-xl font-extrabold text-emerald-800" id="status-title">Buscando solicitação...</h2>
                <p class="text-sm text-slate-500 mt-1" id="status-desc">Aguarde enquanto carregamos as informações.</p>
            </div>
        </section>

        <!-- Visita agendada -->
        <div id="visit-card" class="hidden bg-white rounded-2xl p-4 border border-slate-200 space-y-1">
            <p class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Visita técnica</p>
            <p id="visit-info" class="text-sm font-semibold text-slate-800"></p>
        </div>

        <!-- Proposta recebida -->
        <div id="proposal-card" class="hidden bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
            <p class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Proposta recebida</p>
            <p id="proposal-amount" class="font-display text-3xl font-extrabold text-emerald-800 tabular-nums">R$ 0,00</p>
            <p id="proposal-description" class="text-sm text-slate-600"></p>
            <div id="proposal-actions" class="flex gap-2 pt-2">
                <button type="button" onclick="responderProposta('rejeitado')" class="flex-1 min-h-[48px] bg-white border border-red-300 text-red-600 hover:bg-red-50 font-bold px-3 rounded-lg text-sm transition">
                    Rejeitar
                </button>
                <button type="button" onclick="responderProposta('aceito')" class="flex-1 min-h-[48px] bg-amber-500 hover:bg-amber-600 text-emerald-900 font-extrabold px-3 rounded-lg text-sm transition active:scale-95">
                    Aceitar proposta
                </button>
            </div>
        </div>

        <!-- Pagamento (simulado até integração real com gateway) -->
        <div id="payment-card" class="hidden bg-white rounded-2xl p-5 border border-slate-200 space-y-3 text-center">
            <p class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Pagamento</p>
            <p class="text-sm text-slate-600">Combine a forma de pagamento com o prestador e confirme aqui quando concluído.</p>
            <button type="button" onclick="confirmarPagamento()" class="w-full min-h-[48px] bg-amber-500 hover:bg-amber-600 text-emerald-900 font-extrabold px-4 rounded-lg text-base transition active:scale-95">
                Confirmar pagamento
            </button>
        </div>

        <!-- Etapas do serviço -->
        <div id="updates-card" class="hidden bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
            <h3 class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Acompanhamento do serviço</h3>
            <div id="updates-list" class="space-y-2 text-sm text-slate-600"></div>
        </div>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const requestId = urlParams.get('id');
        let currentRequest = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (requestId) {
                trackRequest(requestId);
            } else {
                document.getElementById('status-title').textContent = 'Solicitação não encontrada';
                document.getElementById('status-desc').textContent = 'Acesse o link enviado após pedir o orçamento.';
            }
        });

        // Cliente sem login: lê pela função no banco (o id do link é a "senha") e
        // consulta de novo a cada 20s, já que o Realtime exige login.
        let pollTimer = null;

        async function trackRequest(id) {
            const { data, error } = await sb.rpc('get_service_request_public', { p_id: id });
            if (error || !data || !data.request) {
                if (error) console.error('Erro ao buscar solicitação:', error);
                if (!currentRequest) {
                    document.getElementById('status-title').textContent = 'Solicitação não encontrada';
                    document.getElementById('status-desc').textContent = 'Confira o link recebido ao pedir o orçamento.';
                }
                return;
            }

            updateUI(data.request);
            renderUpdates(data.updates || []);

            clearTimeout(pollTimer);
            if (!['concluido', 'cancelado', 'rejeitado'].includes(data.request.status)) {
                pollTimer = setTimeout(() => trackRequest(id), 20000);
            }
        }

        function renderUpdates(data) {
            if (!data || data.length === 0) return;

            document.getElementById('updates-card').classList.remove('hidden');
            document.getElementById('updates-list').innerHTML = data.map(u => `
                <div class="border-l-2 border-emerald-200 pl-3 py-1">
                    <p>${escapeHtml(u.note)}</p>
                    <p class="text-xs text-slate-500 mt-0.5">${new Date(u.created_at).toLocaleString('pt-BR')}</p>
                </div>
            `).join('');
        }

        function updateUI(request) {
            currentRequest = request;

            const statusMap = {
                'solicitado': { icon: 'relogio', title: 'Aguardando retorno', desc: 'O prestador recebeu sua solicitação e vai agendar uma visita técnica em breve.' },
                'visita_agendada': { icon: 'calendario', title: 'Visita agendada', desc: 'O prestador vai avaliar sua necessidade na data marcada.' },
                'proposta_enviada': { icon: 'pedidos', title: 'Proposta recebida', desc: 'Confira os detalhes abaixo e responda quando quiser.' },
                'aceito': { icon: 'confirmado', title: 'Proposta aceita', desc: 'Combine o pagamento com o prestador e confirme abaixo.' },
                'rejeitado': { icon: 'cancelado', title: 'Proposta rejeitada', desc: 'Você rejeitou esta proposta.' },
                'pago': { icon: 'cartao', title: 'Pagamento confirmado', desc: 'Aguardando o início do serviço.' },
                'em_andamento': { icon: 'servico', title: 'Serviço em andamento', desc: 'Acompanhe as etapas abaixo.' },
                'concluido': { icon: 'confirmado', title: 'Serviço concluído', desc: 'Obrigado por contratar o comércio da avenida.' },
                'cancelado': { icon: 'cancelado', title: 'Cancelado', desc: 'Esta solicitação foi cancelada.' }
            };

            const current = statusMap[request.status] || statusMap['solicitado'];
            const iconEl = document.getElementById('status-icon');
            const bad = ['rejeitado', 'cancelado'].includes(request.status);
            iconEl.innerHTML = icon(current.icon, 'w-7 h-7');
            iconEl.classList.toggle('bg-red-50', bad);
            iconEl.classList.toggle('text-red-600', bad);
            iconEl.classList.toggle('bg-emerald-50', !bad);
            iconEl.classList.toggle('text-emerald-700', !bad);
            document.getElementById('status-title').textContent = current.title;
            document.getElementById('status-desc').textContent = current.desc;

            // Visita
            const visitCard = document.getElementById('visit-card');
            if (request.visit_scheduled_for) {
                visitCard.classList.remove('hidden');
                const modeLabel = request.visit_mode === 'cliente_leva_ao_prestador' ? 'Você leva até o prestador' : 'O prestador vai até você';
                document.getElementById('visit-info').textContent = `${new Date(request.visit_scheduled_for).toLocaleString('pt-BR')} — ${modeLabel}`;
            } else {
                visitCard.classList.add('hidden');
            }

            // Proposta — só mostra ações enquanto ainda está "proposta_enviada"
            const proposalCard = document.getElementById('proposal-card');
            if (request.proposal_amount && ['proposta_enviada', 'aceito', 'rejeitado', 'pago', 'em_andamento', 'concluido'].includes(request.status)) {
                proposalCard.classList.remove('hidden');
                document.getElementById('proposal-amount').textContent = `${formatBRL(request.proposal_amount)}`;
                document.getElementById('proposal-description').textContent = request.proposal_description || '';
                document.getElementById('proposal-actions').classList.toggle('hidden', request.status !== 'proposta_enviada');
            } else {
                proposalCard.classList.add('hidden');
            }

            // Pagamento — só quando aceito e ainda não pago
            document.getElementById('payment-card').classList.toggle('hidden', request.status !== 'aceito');

            // Etapas do serviço — visíveis a partir de pago
            document.getElementById('updates-card').classList.toggle('hidden', !['pago', 'em_andamento', 'concluido'].includes(request.status));
        }

        async function responderProposta(decision) {
            if (!currentRequest) return;
            const { error } = await sb.rpc('respond_service_proposal', {
                p_id: currentRequest.id,
                p_accept: decision === 'aceito'
            });

            if (error) {
                alert('Não foi possível registrar sua resposta. Tente novamente.');
                console.error(error);
                return;
            }
            trackRequest(currentRequest.id);
        }

        // Simulação de pagamento — sem gateway real integrado ainda (Efí entra numa fase futura).
        // O prestador/cliente confirmam aqui que o pagamento foi acertado por fora do checkout.
        async function confirmarPagamento() {
            if (!currentRequest) return;
            // Comissão calculada no banco (8%, mesma taxa do PLATFORM_COMMISSION_RATE)
            const { error } = await sb.rpc('client_confirm_service_payment', { p_id: currentRequest.id });

            if (error) {
                alert('Não foi possível confirmar o pagamento. Tente novamente.');
                console.error(error);
                return;
            }
            trackRequest(currentRequest.id);
        }
    </script>
</body>
</html>
