<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Lojista — Tipuanas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
      <h1 class="text-2xl font-bold text-emerald-400">🏪 Painel do Comerciante</h1>
      <a href="index.html" class="text-sm text-gray-400 hover:text-white">Ir para Vitrine</a>
    </header>

    <h2 class="text-xl font-bold mb-4">Pedidos Recebidos em Tempo Real</h2>
    <div id="feed-pedidos" class="space-y-4">
      <p class="text-gray-500">Conectando ao banco de dados...</p>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, doc, updateDoc, query } from './firebase-config.js';

    const feed = document.getElementById('feed-pedidos');

    // Escuta novas vendas instantaneamente no Firebase
    onSnapshot(collection(db, "pedidos"), (snapshot) => {
      if (snapshot.empty) {
        feed.innerHTML = `<p class="text-gray-500">Nenhum pedido no sistema momento.</p>`;
        return;
      }

      feed.innerHTML = snapshot.docs.map(docSnap => {
        const p = docSnap.data();
        const id = docSnap.id;
        return `
          <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span class="text-xs bg-emerald-900 text-emerald-300 font-bold px-2 py-1 rounded">${p.loja}</span>
              <h3 class="font-bold text-lg mt-1">Pedido #${id.substring(0, 5)}</h3>
              <p class="text-xs text-gray-400">Itens: ${p.itens.map(i => i.nome).join(', ')}</p>
              <p class="text-sm font-bold text-emerald-400 mt-1">Total: R$ ${p.total.toFixed(2)} | PIN: ${p.pin}</p>
              <span class="text-xs text-amber-400 font-bold">Status: ${p.status}</span>
            </div>

            <div class="flex flex-wrap gap-2">
              ${p.status === 'Pendente' ? `<button onclick="atualizarStatus('${id}', 'Em Preparação')" class="bg-blue-600 text-xs font-bold px-3 py-2 rounded hover:bg-blue-500">Aceitar & Preparar</button>` : ''}
              ${p.status === 'Em Preparação' ? `<button onclick="atualizarStatus('${id}', 'Aguardando Entregador')" class="bg-amber-600 text-xs font-bold px-3 py-2 rounded hover:bg-amber-500">Chamar Entregador</button>` : ''}
              <span class="text-xs text-gray-500">${p.data}</span>
            </div>
          </div>
        `;
      }).join('');
    });

    window.atualizarStatus = async (id, novoStatus) => {
      await updateDoc(doc(db, "pedidos", id), { status: novoStatus });
    };
  </script>
</body>
</html>
