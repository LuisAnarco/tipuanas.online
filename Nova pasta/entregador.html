<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Entregador — Tipuanas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-center border-b pb-4 mb-6">
      <h1 class="text-2xl font-bold text-amber-600">🛵 Painel do Entregador</h1>
      <a href="index.html" class="text-sm text-gray-600 hover:text-black">Ir para Vitrine</a>
    </header>

    <h2 class="text-xl font-bold mb-4">Corridas e Entregas Disponíveis</h2>
    <div id="feed-entregas" class="space-y-4">
      <p class="text-gray-500">Procurando entregas no bairro...</p>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, doc, updateDoc } from './firebase-config.js';

    const feed = document.getElementById('feed-entregas');

    onSnapshot(collection(db, "pedidos"), (snapshot) => {
      const entregas = snapshot.docs.filter(d => d.data().status === 'Aguardando Entregador' || d.data().status === 'Saiu para Entrega');

      if (entregas.length === 0) {
        feed.innerHTML = `<p class="text-gray-500">Nenhuma entrega pendente no momento.</p>`;
        return;
      }

      feed.innerHTML = entregas.map(docSnap => {
        const p = docSnap.data();
        const id = docSnap.id;
        return `
          <div class="bg-white p-5 rounded-xl shadow border border-gray-200 flex justify-between items-center">
            <div>
              <span class="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-1 rounded">Retirar em: ${p.loja}</span>
              <h3 class="font-bold text-lg mt-1">Corrida #${id.substring(0, 5)}</h3>
              <p class="text-xs text-gray-500">Destino: Av. das Tipuanas</p>
              <p class="text-sm font-bold text-gray-700 mt-1">Status: ${p.status}</p>
            </div>

            <div>
              ${p.status === 'Aguardando Entregador' ? 
                `<button onclick="aceitarCorrida('${id}')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs px-4 py-2 rounded-lg">Aceitar Corrida</button>` : 
                `<button onclick="finalizarEntrega('${id}', ${p.pin})" class="bg-green-600 hover:bg-green-700 text-white font-bold text-xs px-4 py-2 rounded-lg">Confirmar PIN e Entregar</button>`
              }
            </div>
          </div>
        `;
      }).join('');
    });

    window.aceitarCorrida = async (id) => {
      await updateDoc(doc(db, "pedidos", id), { status: "Saiu para Entrega" });
    };

    window.finalizarEntrega = async (id, pinCorreto) => {
      const pinDigitado = prompt(`Digite o PIN de 4 dígitos informado pelo cliente:`);
      if (parseInt(pinDigitado) === pinCorreto) {
        await updateDoc(doc(db, "pedidos", id), { status: "Concluído" });
        alert("Entrega finalizada com sucesso!");
      } else {
        alert("PIN incorreto! Confirme com o cliente.");
      }
    };
  </script>
</body>
</html>
