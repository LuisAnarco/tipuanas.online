<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Cardápio - Tipuanas.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="max-w-4xl mx-auto p-4">
        <!-- Header -->
        <header class="flex flex-wrap justify-between items-center gap-3 py-4 border-b border-gray-200 bg-white px-6 rounded-lg shadow-sm mb-6">
            <div>
                <h1 id="store-title" class="text-xl font-bold text-emerald-600">Carregando loja...</h1>
                <p class="text-xs text-gray-500">Gestão de Cardápio</p>
            </div>
            <a href="index.html" class="text-xs text-gray-500 hover:text-emerald-600 underline">Ir para Vitrine</a>
        </header>

        <!-- Navegação -->
        <nav id="merchant-nav" class="hidden flex gap-2 mb-6 text-sm font-medium">
            <a id="nav-pedidos" href="#" class="bg-white border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-50">Pedidos</a>
            <span class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Gerenciar Cardápio</span>
        </nav>

        <!-- Aviso quando não há loja identificada -->
        <section id="no-store-section" class="hidden bg-white rounded-lg shadow-sm p-6 border border-gray-100 text-center">
            <p class="text-sm text-gray-600">Nenhuma loja identificada neste link.</p>
            <a href="04_merchant_portal.html" class="inline-block mt-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-lg">
                Cadastrar ou acessar minha loja
            </a>
        </section>

        <!-- Formulário de novo produto -->
        <section id="new-product-section" class="hidden bg-white rounded-lg shadow-sm p-6 border border-gray-100 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Adicionar Produto</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do produto</label>
                    <input id="np-name" type="text" placeholder="Ex: Pão Francês (500g)" class="w-full text-sm p-2.5 rounded-lg border border-gray-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Preço (R$)</label>
                    <input id="np-price" type="number" min="0" step="0.01" placeholder="Ex: 12.90" class="w-full text-sm p-2.5 rounded-lg border border-gray-300">
                </div>
                <div class="flex items-end">
                    <button onclick="adicionarProduto()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-lg text-sm">
                        Adicionar
                    </button>
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Descrição (opcional)</label>
                    <input id="np-description" type="text" placeholder="Ex: Assado fresco todos os dias" class="w-full text-sm p-2.5 rounded-lg border border-gray-300">
                </div>
            </div>
            <p id="np-error" class="hidden text-xs text-red-600 mt-2"></p>
        </section>

        <!-- Lista de produtos -->
        <main id="products-section" class="hidden bg-white rounded-lg shadow-sm p-6 border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Meus Produtos</h2>
            <div id="products-list" class="space-y-3">
                <p class="text-sm text-gray-400 text-center py-8">Carregando produtos...</p>
            </div>
        </main>
    </div>

    <script src="16_menu_management.js"></script>
</body>
</html>
